<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Solver</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Sudoku Solver</h1>

    <div id="grid"></div>

    <div id="controls">
        <div id="paste-area">
            <input type="text" id="paste-input" placeholder="Paste 81-char puzzle (0 or . for blanks)">
            <button id="load-btn">Load</button>
        </div>
        <div id="paste-error"></div>
        <div id="speed-row">
            <label for="speed-select">Speed:</label>
            <select id="speed-select">
                <option value="300">Slow</option>
                <option value="100" selected>Regular</option>
                <option value="30">Fast</option>
                <option value="5">Very Fast</option>
                <option value="0">No visual</option>
            </select>
        </div>
        <div id="action-row">
            <button id="solve-btn">Solve</button>
            <button id="pause-btn" disabled>Pause</button>
            <button id="resume-btn" disabled>Resume</button>
            <button id="reset-btn" disabled>Reset</button>
        </div>
    </div>

    <div id="status"></div>

    <script type="module" src="app.js"></script>
</body>
</html>
